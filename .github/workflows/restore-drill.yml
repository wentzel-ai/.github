# Reusable quarterly restore-drill workflow. Closes the res-restore-drill
# Compass criterion (PLAT-47). The consumer repo schedules a quarterly
# trigger that calls this workflow; this workflow stands up a parallel
# environment from cold IaC + latest backup, smoke-tests it, tears it
# down, and posts wall-clock recovery time to the per-repo runbook.
#
# The contract: consumer repo defines a `restore-drill.sh` script that
# returns 0 on success and writes a Markdown summary to
# `docs/runbook/restore-drills/{date}-{product}.md`.
#
# Caller pattern (quarterly schedule recommended):
#
#   on:
#     schedule:
#       - cron: '0 14 1 1,4,7,10 *'   # 1st of Jan/Apr/Jul/Oct at 14:00 UTC
#     workflow_dispatch: {}
#   jobs:
#     restore-drill:
#       uses: wentzel-ai/.github/.github/workflows/restore-drill.yml@main
#       with:
#         script_path: scripts/restore-drill.sh
#       secrets: inherit

name: restore-drill

on:
  workflow_call:
    inputs:
      script_path:
        type: string
        required: false
        default: 'scripts/restore-drill.sh'
      timeout_minutes:
        type: number
        required: false
        default: 60

permissions:
  contents: write   # to commit the runbook entry
  id-token: write   # AWS OIDC

jobs:
  drill:
    runs-on: [self-hosted, linux, arm64, wentzel-runner]
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      duration_seconds: ${{ steps.run.outputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v4
      - name: Run restore-drill script
        id: run
        run: |
          set -euo pipefail
          START=$(date +%s)
          if [ ! -x "${{ inputs.script_path }}" ]; then
            echo "::error::restore-drill script ${{ inputs.script_path }} not found."
            exit 1
          fi
          "${{ inputs.script_path }}"
          END=$(date +%s)
          DUR=$((END - START))
          echo "duration_seconds=$DUR" >> "$GITHUB_OUTPUT"
          echo "Restore drill completed in ${DUR}s."
      - name: Commit drill outcome to runbook
        if: success()
        run: |
          set -e
          DATE=$(date +%Y-%m-%d)
          mkdir -p docs/runbook/restore-drills
          FILE="docs/runbook/restore-drills/${DATE}-drill.md"
          cat > "$FILE" <<EOF
          # Restore drill — ${DATE}

          - Workflow run: \`${{ github.run_id }}\`
          - Duration: ${{ steps.run.outputs.duration_seconds }}s
          - Triggered by: \`${{ github.event_name }}\`
          - Status: success

          Compare to the product's stated RTO in
          \`docs/data-flow-diagram.md\`. If duration > RTO, file a
          SEC-* ticket to either close the gap or update the RTO target.
          EOF
          git config user.name 'wentzel-bot'
          git config user.email 'noreply@wentzel.ai'
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(restore-drill): record ${DATE} successful drill (${{ steps.run.outputs.duration_seconds }}s)"
          git push
