# Reusable backup-verify workflow. Closes the res-backup-verify Compass
# criterion (PLAT-47). Calls into a per-product `verify-backup.sh`
# script that the consumer repo defines (path is parameterizable).
#
# The contract: the consumer repo's verify-backup.sh script
#   1. Pulls the most recent backup artifact (S3 / Supabase / etc.)
#   2. Restores to a temp environment
#   3. Runs a smoke test
#   4. Tears down + exits 0 on success, non-zero on failure
#
# Caller pattern:
#
#   jobs:
#     backup-verify:
#       uses: wentzel-ai/.github/.github/workflows/backup-verify.yml@main
#       with:
#         script_path: scripts/verify-backup.sh
#       secrets: inherit

name: backup-verify

on:
  workflow_call:
    inputs:
      script_path:
        type: string
        required: false
        default: 'scripts/verify-backup.sh'
      timeout_minutes:
        type: number
        required: false
        default: 15

permissions:
  contents: read
  id-token: write   # for AWS OIDC role-assume

jobs:
  verify:
    runs-on: [self-hosted, linux, arm64, wentzel-runner]
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v4
      - name: Run backup-verify script
        run: |
          set -euo pipefail
          if [ ! -x "${{ inputs.script_path }}" ]; then
            echo "::error::backup-verify script ${{ inputs.script_path }} not found or not executable."
            exit 1
          fi
          "${{ inputs.script_path }}"
      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Backup verify failed. Triage required — does the latest backup actually restore?"
